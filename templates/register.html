{% extends "base.html" %}

{% block content %}

<h2>Register</h2>

<form method="POST">
    <label>Name</label>
    <input
        type="text"
        name="name"
        class="form-control mb-3"
        placeholder="Enter your name">
        
    <label>Email</label>
    <input
        type="email"
        name="email"
        class="form-control mb-3"
        placeholder="Enter your email">
        
    <label>Password</label>
    <input
        type="password"
        name="password"
        class="form-control mb-3"
        placeholder="Enter your password">
        
    <label>Role</label>
    <select
        name="role"
        class="form-control mb-3">

        <option value="user">
            User
        </option>

        <option value="staff">
            Staff
        </option>

    </select>

    <button class="btn btn-success">

        Register

    </button>

</form>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body p-4 bg-dark-subtle bg-gradient border rounded-3">
                <h3 class="card-title mb-4"><i class="bi bi-person-circle"></i> User Profile</h3>

                <form method="POST">

                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
                    </div>

                    <button class="btn btn-success">Update Profile</button>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

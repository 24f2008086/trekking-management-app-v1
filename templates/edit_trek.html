{% extends "base.html" %}

{% block content %}

<div class="container mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        <i class="bi bi-pencil-square"></i>

                        Edit Trek

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Trek Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    value="{{ trek.name }}"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Location
                                </label>

                                <input
                                    type="text"
                                    name="location"
                                    class="form-control"
                                    value="{{ trek.location }}"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Difficulty
                                </label>

                                <select
                                    name="difficulty"
                                    class="form-select">

                                    <option value="Easy"
                                    {% if trek.difficulty=="Easy" %}selected{% endif %}>
                                        Easy
                                    </option>

                                    <option value="Moderate"
                                    {% if trek.difficulty=="Moderate" %}selected{% endif %}>
                                        Moderate
                                    </option>

                                    <option value="Hard"
                                    {% if trek.difficulty=="Hard" %}selected{% endif %}>
                                        Hard
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Duration (Days)
                                </label>

                                <input
                                    type="number"
                                    name="duration"
                                    class="form-control"
                                    value="{{ trek.duration }}"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Available Slots
                                </label>

                                <input
                                    type="number"
                                    name="slots"
                                    class="form-control"
                                    value="{{ trek.available_slots }}"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Start Date
                                </label>

                                <input
                                    type="date"
                                    name="start_date"
                                    class="form-control"
                                    value="{{ trek.start_date }}"
                                    required>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                End Date
                            </label>

                            <input
                                type="date"
                                name="end_date"
                                class="form-control"
                                value="{{ trek.end_date }}"
                                required>

                        </div>

                        <div class="d-grid">

                            <button
                                class="btn btn-primary btn-lg">

                                <i class="bi bi-check-circle"></i>

                                Update Trek

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

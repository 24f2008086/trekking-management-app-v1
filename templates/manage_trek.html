{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Manage Trek</h2>

<form method="POST">

    <div class="mb-3">

        <label>Trek Name</label>

        <input
            type="text"
            class="form-control"
            value="{{ trek.name }}"
            readonly>

    </div>

    <div class="mb-3">

        <label>Available Slots</label>

        <input
            type="number"
            name="available_slots"
            class="form-control"
            value="{{ trek.available_slots }}"
            required>

    </div>

    <div class="mb-3">

        <label>Status</label>

        <select
            name="status"
            class="form-control">

            <option value="Open"
            {% if trek.status=="Open" %}selected{% endif %}>
            Open
            </option>

            <option value="Closed"
            {% if trek.status=="Closed" %}selected{% endif %}>
            Closed
            </option>

            <option value="Started"
            {% if trek.status=="Started" %}selected{% endif %}>
            Started
            </option>

            <option value="Completed"
            {% if trek.status=="Completed" %}selected{% endif %}>
            Completed
            </option>

        </select>

    </div>

    <button class="btn btn-success">

        Update Trek

    </button>

</form>


<hr class="my-5">

<h3>Registered Participants</h3>

<table class="table table-bordered">

    <thead class="table-dark">

        <tr>

            <th>Booking ID</th>
            <th>User Name</th>
            <th>Booking Date</th>
            <th>Status</th>

        </tr>

    </thead>

    <tbody>

        {% for booking in bookings %}

        <tr>

            <td>{{ booking.id }}</td>
            <td>{{ booking.user.name }}</td>
            <td>{{ booking.booking_date }}</td>
            <td>{{ booking.status }}</td>

        </tr>

        {% endfor %}

    </tbody>

</table>
{% endblock %}

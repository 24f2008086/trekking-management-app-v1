{% extends "base.html" %}

{% block content %}

<div class="container mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-success text-white">

                    <h3 class="mb-0">
                        <i class="bi bi-plus-circle"></i>
                        Add New Trek
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Trek Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    placeholder="Enter trek name"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Location
                                </label>

                                <input
                                    type="text"
                                    name="location"
                                    class="form-control"
                                    placeholder="Enter location"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Difficulty
                                </label>

                                <select
                                    name="difficulty"
                                    class="form-select">

                                    <option>Easy</option>
                                    <option>Moderate</option>
                                    <option>Hard</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Duration (Days)
                                </label>

                                <input
                                    type="number"
                                    name="duration"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Available Slots
                                </label>

                                <input
                                    type="number"
                                    name="slots"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Start Date
                                </label>

                                <input
                                    type="date"
                                    name="start_date"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                End Date
                            </label>

                            <input
                                type="date"
                                name="end_date"
                                class="form-control"
                                required>

                        </div>

                        <div class="d-grid">

                            <button
                                class="btn btn-success btn-lg">

                                <i class="bi bi-plus-circle"></i>

                                Add Trek

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
